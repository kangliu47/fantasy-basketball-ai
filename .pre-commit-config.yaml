repos:
  - repo: local
    hooks:
      - id: publication-privacy
        name: Public file privacy check
        entry: .venv/bin/python -m tools.check_publication
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
