# Project defaults; an explicit user model/reasoning selection takes precedence.
# Remove these two keys to inherit personal defaults instead.
model = "gpt-6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
# Unspecified agents stay capable; select utility_worker explicitly for Luna.
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "high"
