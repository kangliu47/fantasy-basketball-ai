<div class="build-control">
  @if (build.status() === 'update' || build.status() === 'unavailable') {
    <span class="build-attention" role="status">
      {{ build.message() }}
      @if (build.status() === 'update') {
        <small>Save unfinished edits before refreshing.</small>
      }
    </span>
  }
  <button
    mat-icon-button
    type="button"
    aria-label="UI build information"
    (click)="detailsOpen.set(true)"
  >
    <span aria-hidden="true">ⓘ</span>
  </button>
</div>
@defer (when detailsOpen()) {
  @if (detailsOpen()) {
    <app-build-details (closed)="detailsOpen.set(false)" />
  }
}
