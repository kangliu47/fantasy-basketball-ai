<!doctype html>
<html lang="en" data-ui-style="fantasy-analytics-v1">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fantasy Basketball · My season workflow preview</title>
    <link rel="stylesheet" href="showcase-theme.css" />
    <style>
      .showcase-header, .row { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; }
      .between { justify-content: space-between; }
      .showcase-page { max-width: 1060px; padding-top: 22px; }
      .showcase-title { font-size: clamp(27px, 4vw, 36px); margin: 0; }
      .showcase-card { padding: 18px; margin-block: 14px; }
      h1, h2, h3 { color: var(--showcase-heading); }
      h2 { font-size: 19px; margin: 0; }
      h3 { font-size: 16px; margin: 0; }
      p { line-height: 1.5; margin: .5rem 0; }
      .muted { color: var(--showcase-muted); font-size: .875rem; }
      .warning { border-left: 3px solid var(--showcase-orange); padding-left: 12px; }
      .primary, .primary:hover { background: var(--showcase-green-strong); color: white; }
      .link { background: none; border: 0; color: var(--showcase-green-strong); cursor: pointer; padding: 7px 0; text-decoration: underline; }
      .season-grid { display: grid; align-items: start; grid-template-columns: minmax(0, 1fr); }
      .season-grid > .showcase-card { min-width: 0; }
      .stats { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); margin: 12px 0; }
      .stat { background: var(--showcase-surface-soft); border-radius: 8px; padding: 10px 12px; }
      .stat span { display: block; margin-top: 4px; }
      .player-row { border-top: 1px solid var(--showcase-line); padding: 10px 0; }
      .gain { color: var(--showcase-green-strong); }
      .loss { color: var(--showcase-red); }
      .showcase-banner { margin: 14px 0; }
      details { margin: 10px 0; }
      summary { color: var(--showcase-green-strong); cursor: pointer; padding: 5px 0; }
      select, textarea { border: 1px solid var(--showcase-control-line); background: var(--showcase-surface); color: inherit; border-radius: 6px; padding: 7px; }
      label { display: grid; gap: 5px; }
      textarea { width: min(100%, 440px); }
      fieldset { border: 1px solid var(--showcase-line); border-radius: 8px; margin: 10px 0; }
      .table-scroll { overflow-x: auto; }
      table { border-collapse: collapse; font-size: .9rem; width: 100%; }
      th, td { padding: 8px; border-bottom: 1px solid var(--showcase-line); text-align: left; }
      tbody th { font-weight: 600; }
      dialog { width: min(92vw, 460px); border: 1px solid var(--showcase-control-line); color: inherit; }
      dialog::backdrop { background: #183c3044; }
      @media (min-width: 800px) {
        .season-grid { grid-template-columns: minmax(250px, 1fr) minmax(0, 2fr); gap: 14px; }
        .stats { grid-template-columns: 1fr; }
      }
      @media (max-width: 540px) {
        .showcase-header { padding: 12px 16px; }
        .showcase-page { padding-inline: 14px; }
        .showcase-card { padding: 13px; }
        .stats { grid-template-columns: 1fr; }
        .table-scroll table { min-width: 340px; }
      }
    </style>
    <script src="my-season-preview.js" defer></script>
  </head>
  <body>
    <header class="showcase-header between">
      <div class="showcase-brand">Fantasy Basketball</div>
      <button class="showcase-button" id="data-button" data-action="data">Data &amp; connection</button>
    </header>
    <main class="showcase-page">
      <nav class="row" aria-label="Main workspaces">
        <button class="showcase-button" data-action="season">My season</button>
        <button class="showcase-button" data-action="draft">Draft</button>
        <button class="showcase-button" data-action="history">History</button>
      </nav>
      <p class="showcase-banner">Interactive preview with synthetic data</p>
      <section id="view" aria-label="Workspace"></section>
      <details>
        <summary>Preview data states</summary>
        <div class="row">
          <button class="showcase-button" data-action="reset">Reset preview</button>
          <button class="showcase-button" data-action="stale">Stale watch</button>
          <button class="showcase-button" data-action="empty">First launch</button>
          <button class="showcase-button" data-action="partial">Incomplete stats</button>
        </div>
      </details>
    </main>
    <dialog class="showcase-card" id="data-dialog" aria-labelledby="data-title">
      <div class="row between">
        <h2 id="data-title" tabindex="-1">Data &amp; connection</h2>
        <form method="dialog"><button class="showcase-button">Close</button></form>
      </div>
      <div id="data-content"></div>
    </dialog>
  </body>
</html>
