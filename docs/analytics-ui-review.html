textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;historical-patterns-mock&#x27;);
  if (!root) return;

  const categories = [&#x27;FG%&#x27;, &#x27;FT%&#x27;, &#x27;3PM&#x27;, &#x27;PTS&#x27;, &#x27;REB&#x27;, &#x27;AST&#x27;, &#x27;STL&#x27;, &#x27;BLK&#x27;];
  const managers = [
    { id: &#x27;me&#x27;, name: &#x27;My profile&#x27;, seasons: 5, relative: [0.04, -0.11, -0.03, 0.02, 0.18, -0.07, 0.06, 0.14], outcome: [0.58, 0.42, 0.51, 0.55, 0.72, 0.46, 0.61, 0.68] },
    { id: &#x27;north&#x27;, name: &#x27;North Star&#x27;, seasons: 5, relative: [-0.08, 0.16, 0.12, 0.06, -0.11, 0.15, 0.01, -0.13], outcome: [0.43, 0.75, 0.68, 0.59, 0.39, 0.72, 0.53, 0.35] },
    { id: &#x27;corner&#x27;, name: &#x27;Corner Three&#x27;, seasons: 4, relative: [-0.04, 0.09, 0.21, 0.14, -0.08, 0.02, -0.12, -0.17], outcome: [0.48, 0.64, 0.81, 0.73, 0.44, 0.57, 0.38, 0.31] },
    { id: &#x27;paint&#x27;, name: &#x27;Paint Control&#x27;, seasons: 5, relative: [0.13, -0.18, -0.09, -0.05, 0.16, -0.10, 0.02, 0.19], outcome: [0.69, 0.31, 0.42, 0.46, 0.74, 0.40, 0.55, 0.78] },
    { id: &#x27;balance&#x27;, name: &#x27;Balanced Books&#x27;, seasons: 3, relative: [0.02, 0.04, -0.01, 0.05, -0.02, 0.01, -0.03, -0.06], outcome: [0.56, 0.60, 0.53, 0.62, 0.51, 0.55, 0.49, 0.45] }
  ];
  const pressure = [
    { code: &#x27;FG%&#x27;, gap: &#x27;0.7 pp&#x27;, norm: 0.08, threshold: &#x27;48.9%&#x27;, continuity: &#x27;2 of 4 repeated&#x27;, note: &#x27;Tight upper ranks&#x27;, question: &#x27;Historically close ranks: would a modest future efficiency gain be enough, once 2027 shot volume and prices exist?&#x27; },
    { code: &#x27;FT%&#x27;, gap: &#x27;1.1 pp&#x27;, norm: 0.12, threshold: &#x27;81.0%&#x27;, continuity: &#x27;1 of 4 repeated&#x27;, note: &#x27;Leaders rotated&#x27;, question: &#x27;Leaders changed often. Keep this flexible until 2027 attempts, prices, and roster construction are known.&#x27; },
    { code: &#x27;3PM&#x27;, gap: &#x27;41&#x27;, norm: 0.10, threshold: &#x27;1,020&#x27;, continuity: &#x27;2 of 4 repeated&#x27;, note: &#x27;Moderate pressure&#x27;, question: &#x27;Several managers produced strong 3PM outcomes. Later, test whether the future market makes this production expensive or replaceable.&#x27; },
    { code: &#x27;PTS&#x27;, gap: &#x27;388&#x27;, norm: 0.14, threshold: &#x27;15,840&#x27;, continuity: &#x27;3 of 4 repeated&#x27;, note: &#x27;Stable leaders&#x27;, question: &#x27;Upper scoring ranks were relatively separated. Historical standings alone cannot tell whether paying to close that gap is efficient.&#x27; },
    { code: &#x27;REB&#x27;, gap: &#x27;176&#x27;, norm: 0.19, threshold: &#x27;6,420&#x27;, continuity: &#x27;3 of 4 repeated&#x27;, note: &#x27;Wide upper gaps&#x27;, question: &#x27;You repeatedly emphasized REB and upper ranks were separated. Is this an identity to preserve once future acquisition cost is visible?&#x27; },
    { code: &#x27;AST&#x27;, gap: &#x27;132&#x27;, norm: 0.09, threshold: &#x27;3,940&#x27;, continuity: &#x27;2 of 4 repeated&#x27;, note: &#x27;Crowded middle&#x27;, question: &#x27;Your AST history was weaker while neighboring ranks stayed close. This is a candidate to investigate, not yet a target.&#x27; },
    { code: &#x27;STL&#x27;, gap: &#x27;27&#x27;, norm: 0.07, threshold: &#x27;712&#x27;, continuity: &#x27;1 of 4 repeated&#x27;, note: &#x27;Tight and rotating&#x27;, question: &#x27;Small historical gaps and rotating leaders suggest flexibility, but 2027 player availability is still unknown.&#x27; },
    { code: &#x27;BLK&#x27;, gap: &#x27;38&#x27;, norm: 0.17, threshold: &#x27;548&#x27;, continuity: &#x27;3 of 4 repeated&#x27;, note: &#x27;Separated tiers&#x27;, question: &#x27;BLK and REB were both repeated strengths. Later, check whether one construction supplies both without overpaying.&#x27; }
  ];
  const state = {
    metric: &#x27;relative&#x27;,
    manager: &#x27;me&#x27;,
    category: &#x27;REB&#x27;,
    dataState: &#x27;loaded&#x27;,
    detailLayout: &#x27;right-rail&#x27;,
    density: &#x27;comfortable&#x27;
  };

  const q = (selector) =&gt; root.querySelector(selector);
  const qa = (selector) =&gt; [...root.querySelectorAll(selector)];
  const clamp = (value, min, max) =&gt; Math.max(min, Math.min(max, value));

  function cellColor(value, metric) {
    const centered = metric === &#x27;relative&#x27; ? value : value - 0.5;
    const strength = clamp(Math.abs(centered) / (metric === &#x27;relative&#x27; ? 0.22 : 0.34), 0, 1);
    const source = centered &gt;= 0 ? &#x27;var(--hp-positive)&#x27; : &#x27;var(--hp-negative)&#x27;;
    return `color-mix(in srgb, ${source} ${Math.round(16 + strength * 58)}%, var(--hp-surface))`;
  }

  function detailRows(manager, categoryIndex) {
    const baseRelative = manager.relative[categoryIndex];
    const baseOutcome = manager.outcome[categoryIndex];
    const years = [2022, 2023, 2024, 2025, 2026].slice(5 - manager.seasons);
    const offsets = [-0.035, 0.02, -0.012, 0.028, 0.006];
    return years.map((year, index) =&gt; {
      const tilt = clamp(baseRelative + offsets[(index + categoryIndex) % offsets.length], -0.3, 0.3);
      const finish = clamp(baseOutcome + offsets[(index + manager.name.length) % offsets.length], 0.06, 0.94);
      const teams = year % 2 ? 12 : 13;
      const rank = Math.max(1, Math.min(teams, Math.round(teams - finish * (teams - 1))));
      return { year, tilt, finish, rank, teams };
    });
  }

  function renderHeatmap() {
    q(&#x27;[data-heat-head]&#x27;).innerHTML = `&lt;th scope=&quot;col&quot;&gt;Manager&lt;/th&gt;${categories.map(code =&gt; `&lt;th scope=&quot;col&quot;&gt;${code}&lt;/th&gt;`).join(&#x27;&#x27;)}`;
    q(&#x27;[data-heat-body]&#x27;).innerHTML = managers.map((manager, managerIndex) =&gt; {
      const values = manager[state.metric];
      const cells = categories.map((code, categoryIndex) =&gt; {
        const partial = state.dataState === &#x27;partial&#x27; &amp;&amp; ((managerIndex + categoryIndex) % 9 === 0);
        const selected = manager.id === state.manager &amp;&amp; code === state.category;
        const value = values[categoryIndex];
        const label = state.metric === &#x27;relative&#x27; ? `${value &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${value.toFixed(2)}` : `${Math.round(value * 100)}th`;
        return `&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;hp-cell${selected ? &#x27; selected&#x27; : &#x27;&#x27;}${partial ? &#x27; unavailable&#x27; : &#x27;&#x27;}&quot; data-manager=&quot;${manager.id}&quot; data-category=&quot;${code}&quot; ${partial ? &#x27;aria-label=&quot;Unavailable evidence&quot;&#x27; : `style=&quot;background:${cellColor(value, state.metric)}&quot; aria-label=&quot;${manager.name}, ${code}, ${label}, ${manager.seasons} eligible seasons&quot;`}&gt;&lt;strong&gt;${partial ? &#x27;—&#x27; : label}&lt;/strong&gt;&lt;small&gt;${partial ? &#x27;Unavailable&#x27; : `${manager.seasons} seasons`}&lt;/small&gt;&lt;/button&gt;&lt;/td&gt;`;
      }).join(&#x27;&#x27;);
      return `&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;${manager.name}${manager.id === &#x27;me&#x27; ? &#x27;&lt;small&gt; · Me&lt;/small&gt;&#x27; : &#x27;&#x27;}&lt;/th&gt;${cells}&lt;/tr&gt;`;
    }).join(&#x27;&#x27;);
    qa(&#x27;[data-metric]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.metric === state.metric)));
    qa(&#x27;.hp-cell[data-manager]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
      if (button.classList.contains(&#x27;unavailable&#x27;)) return;
      state.manager = button.dataset.manager;
      state.category = button.dataset.category;
      render();
      q(&#x27;[data-section=&quot;detail&quot;]&#x27;).scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;nearest&#x27; });
    }));
  }

  function renderDetail() {
    const manager = managers.find(item =&gt; item.id === state.manager) || managers[0];
    const categoryIndex = categories.indexOf(state.category);
    const rows = detailRows(manager, categoryIndex);
    const positive = rows.filter(row =&gt; row.tilt &gt; 0).length;
    const shrunken = manager.relative[categoryIndex] * manager.seasons / (manager.seasons + 2);
    q(&#x27;[data-detail-title]&#x27;).textContent = `${manager.name} · ${state.category}`;
    q(&#x27;[data-consistency]&#x27;).textContent = `${positive} of ${rows.length} above baseline`;
    q(&#x27;[data-shrunken]&#x27;).textContent = `${shrunken &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${shrunken.toFixed(2)}`;
    q(&#x27;[data-repeat]&#x27;).textContent = `${positive}/${rows.length} seasons`;
    q(&#x27;[data-outcome]&#x27;).textContent = `${Math.round(manager.outcome[categoryIndex] * 100)}th pct.`;
    q(&#x27;[data-season-list]&#x27;).innerHTML = rows.map(row =&gt; {
      const width = Math.abs(row.tilt) / 0.3 * 50;
      return `&lt;div class=&quot;hp-season-row&quot;&gt;&lt;span&gt;${row.year}&lt;/span&gt;&lt;div class=&quot;hp-season-bar&quot; aria-label=&quot;${row.year} tilt ${row.tilt.toFixed(2)}&quot;&gt;&lt;i class=&quot;${row.tilt &gt;= 0 ? &#x27;positive&#x27; : &#x27;negative&#x27;}&quot; style=&quot;width:${width}%;&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;strong&gt;${row.rank}/${row.teams}&lt;/strong&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    q(&#x27;[data-evidence-copy]&#x27;).textContent = `${manager.seasons} eligible synthetic whole-season assignments · average-tie ranks · missing seasons excluded, not zero.`;
  }

  function renderPressure() {
    q(&#x27;[data-pressure-body]&#x27;).innerHTML = pressure.map(item =&gt; `&lt;tr class=&quot;hp-pressure-row${item.code === state.category ? &#x27; selected&#x27; : &#x27;&#x27;}&quot; data-pressure=&quot;${item.code}&quot;&gt;&lt;th scope=&quot;row&quot;&gt;&lt;button type=&quot;button&quot;&gt;${item.code}&lt;/button&gt;&lt;/th&gt;&lt;td&gt;${item.gap}&lt;small&gt; · ${Math.round(item.norm * 100)}% of range&lt;/small&gt;&lt;/td&gt;&lt;td&gt;${item.threshold}&lt;/td&gt;&lt;td&gt;${item.continuity}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
    const item = pressure.find(row =&gt; row.code === state.category) || pressure[0];
    q(&#x27;[data-pressure-code]&#x27;).textContent = `${item.code} · 2024–2026`;
    q(&#x27;[data-pressure-title]&#x27;).textContent = `${item.note}`;
    q(&#x27;[data-pressure-note]&#x27;).textContent = `Typical gap ${item.gap}`;
    const base = categories.indexOf(item.code) * 3;
    q(&#x27;[data-distribution-rows]&#x27;).innerHTML = [2024, 2025, 2026].map((year, yearIndex) =&gt; {
      const points = Array.from({ length: year % 2 ? 12 : 13 }, (_, index) =&gt; clamp(7 + index * (84 / (year % 2 ? 11 : 12)) + ((index * 7 + base + yearIndex * 3) % 7 - 3), 3, 97));
      const mineIndex = (base + yearIndex + 4) % points.length;
      return `&lt;div class=&quot;hp-dist-row&quot;&gt;&lt;strong&gt;${year}&lt;/strong&gt;&lt;div class=&quot;hp-dot-track&quot; aria-label=&quot;${item.code} ${year} league distribution&quot;&gt;${points.map((left, index) =&gt; `&lt;i class=&quot;${index === mineIndex ? &#x27;mine&#x27; : &#x27;&#x27;}&quot; style=&quot;left:${left}%&quot;&gt;&lt;span hidden&gt;${index === mineIndex ? &#x27;My team&#x27; : &#x27;Other team&#x27;}&lt;/span&gt;&lt;/i&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    q(&#x27;[data-pressure-question]&#x27;).textContent = item.question;
    qa(&#x27;[data-pressure]&#x27;).forEach(row =&gt; row.addEventListener(&#x27;click&#x27;, () =&gt; {
      state.category = row.dataset.pressure;
      render();
    }));
  }

  function renderState() {
    const status = q(&#x27;[data-status]&#x27;);
    const empty = q(&#x27;[data-empty]&#x27;);
    const content = q(&#x27;[data-content]&#x27;);
    status.hidden = true;
    empty.hidden = state.dataState !== &#x27;empty&#x27;;
    content.hidden = state.dataState === &#x27;empty&#x27;;
    status.className = &#x27;hp-status&#x27;;
    if (state.dataState === &#x27;partial&#x27;) {
      status.hidden = false;
      status.textContent = &#x27;Some manager-season cells are unavailable. Summaries use eligible seasons only; missing evidence is never zero.&#x27;;
    } else if (state.dataState === &#x27;error&#x27;) {
      status.hidden = false;
      status.classList.add(&#x27;hp-error&#x27;);
      status.textContent = &#x27;Could not refresh historical patterns. Showing the last successful saved analysis from September 5, 2026.&#x27;;
    }
  }

  function render() {
    root.classList.toggle(&#x27;hp-compact&#x27;, state.density === &#x27;compact&#x27;);
    q(&#x27;[data-layout]&#x27;).classList.toggle(&#x27;hp-stacked&#x27;, state.detailLayout === &#x27;stacked&#x27;);
    renderState();
    if (state.dataState !== &#x27;empty&#x27;) {
      renderHeatmap();
      renderDetail();
      renderPressure();
    }
  }

  qa(&#x27;[data-metric]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    state.metric = button.dataset.metric;
    render();
  }));
  qa(&#x27;[data-jump]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    q(`[data-section=&quot;${button.dataset.jump}&quot;]`)?.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
  }));
  q(&#x27;[data-open-pressure]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; q(&#x27;[data-section=&quot;pressure&quot;]&#x27;).scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; }));

  render();

  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: render });
    tweak.addSelect(state, &#x27;detailLayout&#x27;, { label: &#x27;Evidence detail layout&#x27;, reference: &#x27;mock.detail_layout&#x27;, options: [{ label: &#x27;Right rail&#x27;, value: &#x27;right-rail&#x27; }, { label: &#x27;Stacked&#x27;, value: &#x27;stacked&#x27; }] });
    tweak.addSelect(state, &#x27;density&#x27;, { label: &#x27;Information density&#x27;, reference: &#x27;mock.density&#x27;, options: [&#x27;comfortable&#x27;, &#x27;compact&#x27;] });
    tweak.addSelect(state, &#x27;dataState&#x27;, { label: &#x27;Evidence state&#x27;, reference: &#x27;mock.data_state&#x27;, options: [&#x27;loaded&#x27;, &#x27;partial&#x27;, &#x27;empty&#x27;, &#x27;error&#x27;] });
  }
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
