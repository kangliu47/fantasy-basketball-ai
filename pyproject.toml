[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fantasy-basketball-ai"
version = "0.2.0"
description = "Local, read-only fantasy basketball intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.115,<1",
    "fastmcp>=3,<4",
    "httpx>=0.28,<0.29",
    "keyring>=25,<26",
    "playwright>=1.50,<2",
    "python-dotenv>=1.1,<2",
    "pytz>=2025.2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
espn-probe = "fantasy_ai.probe:main"
fantasy-workspace = "fantasy_ai.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_ai", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "work", "frontend", "docs/PRD.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "tests"]
